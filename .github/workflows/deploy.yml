name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Деплой через официальное Pages API (artifact). Env-переменные Vite берём из
# секретов репозитория — .env в git не хранится (смотри .gitignore).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize .env from secrets
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
            echo "VITE_SITE_URL=${{ secrets.VITE_SITE_URL }}"
            echo "VITE_BOOTH_EMAIL=${{ secrets.VITE_BOOTH_EMAIL }}"
            echo "VITE_BOOTH_KEY=${{ secrets.VITE_BOOTH_KEY }}"
            echo "VITE_IMGBB_API_KEY=${{ secrets.VITE_IMGBB_API_KEY }}"
          } > .env

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4